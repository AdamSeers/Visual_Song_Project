services:
  color-api:
    build:
      context: ./color-api
      dockerfile: Dockerfile
    container_name: color-api
    volumes:
      - ./color-api/nga.db:/app/nga.db # read-mostly reference data; single-file mount is fine
    restart: unless-stopped

  visual-song:
    build:
      context: .
      dockerfile: visual-song-flask/Dockerfile
    container_name: visual-song
    environment:
      - COLOR_API_BASE=http://color-api:5050
    volumes:
      - ./visual-song-flask/uploads:/app/uploads
      - ./visual-song-flask/outputs:/app/outputs
    depends_on:
      - color-api
    restart: unless-stopped

  caddy:
    image: caddy:2
    container_name: caddy
    profiles: [ "prod" ] # only runs when explicitly asked for
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - visual-song
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
